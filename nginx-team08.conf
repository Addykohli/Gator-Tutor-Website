server {
    listen 80;
    server_name 18.220.232.53;
    client_max_body_size 100M;

    # Frontend - React App
    location / {
        root /home/addy/csc648-fa25-145-team08/application/client/build;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API Routes - Proxy to FastAPI backend
    location /api/ {
        proxy_pass http://unix:/run/uvicorn-team08/uvicorn-team08.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoints
    location ~ ^/(health|healthz)$ {
        proxy_pass http://unix:/run/uvicorn-team08/uvicorn-team08.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Media Files - Direct serving by Nginx
    location /media/ {
        alias /home/addy/media/;
        
        # Security: prevent access to hidden files
        location ~ /\. {
            deny all;
        }
        
        # Cache media files
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # CORS headers for media
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
